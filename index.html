
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LankaMart - Online Shopping</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #f57224;
      color: white;
      padding: 18px 6%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    #search {
      padding: 13px;
      border: none;
      border-radius: 5px;
      flex: 1;
      min-width: 180px;
      max-width: 550px;
    }

    .cart-button, button {
      cursor: pointer;
      border: none;
    }

    .cart-button {
      background: white;
      color: #f57224;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 40px 15px;
      background: #fff2e8;
    }

    .hero h1 { margin-bottom: 10px; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px;
    }

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 9px;
      box-shadow: 0 2px 8px #00000012;
    }

    .product-image {
      font-size: 65px;
      text-align: center;
      padding: 25px;
      background: #f8f8f8;
      border-radius: 6px;
    }

    .price {
      color: #f57224;
      font-size: 20px;
      font-weight: bold;
    }

    .add-button, .checkout-button {
      background: #f57224;
      color: white;
      padding: 12px;
      border-radius: 5px;
      width: 100%;
    }

    .add-button:hover,
    .checkout-button:hover {
      background: #dc5e14;
    }

    .cart-panel {
      background: white;
      padding: 20px;
      border-radius: 9px;
      margin-top: 25px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .remove-button {
      background: #eee;
      border-radius: 5px;
      padding: 8px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #222;
      color: white;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .topbar { flex-direction: column; }
      #search { width: 100%; }
      .logo { font-size: 22px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="logo">🛒 LankaMart</div>

      <input
        id="search"
        type="search"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <button class="cart-button"
              onclick="showCart()">
        Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>Welcome to LankaMart!</h1>
    <p>Discover great products at great prices.</p>
  </section>

  <main>
    <h2>Our Products</h2>
    <div class="products" id="product-list"></div>

    <section class="cart-panel" id="cart-section">
      <h2>Your Shopping Cart</h2>
      <div id="cart-items"></div>
      <h3>Total: Rs. <span id="total">0</span></h3>

      <button class="checkout-button"
              onclick="checkout()">
        Checkout (Demo)
      </button>
    </section>
  </main>

  <footer>
    © 2026 LankaMart - Learning Project
  </footer>

  <script>
    const products = [
      { id: 1, name: "Smartphone", price: 45000, icon: "📱" },
      { id: 2, name: "Laptop", price: 185000, icon: "💻" },
      { id: 3, name: "Headphones", price: 6500, icon: "🎧" },
      { id: 4, name: "Smart Watch", price: 12000, icon: "⌚" },
      { id: 5, name: "Backpack", price: 4500, icon: "🎒" },
      { id: 6, name: "Camera", price: 95000, icon: "📷" }
    ];

    const cart = [];

    function formatPrice(amount) {
      return amount.toLocaleString("en-LK");
    }

    function displayProducts(searchText = "") {
      const list = document.getElementById("product-list");
      list.innerHTML = "";

      const filtered = products.filter(product =>
        product.name.toLowerCase()
          .includes(searchText.toLowerCase())
      );

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";

        card.innerHTML = `
          <div class="product-image">${product.icon}</div>
          <h3>${product.name}</h3>
          <p class="price">Rs. ${formatPrice(product.price)}</p>
          <button class="add-button"
                  onclick="addToCart(${product.id})">
            Add to Cart
          </button>
        `;

        list.appendChild(card);
      });

      if (filtered.length === 0) {
        list.textContent = "No products found.";
      }
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      if (item) {
        cart.push(item);
        updateCart();
      }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      const container = document.getElementById("cart-items");
      container.innerHTML = "";

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        const row = document.createElement("div");
        row.className = "cart-row";

        row.innerHTML = `
          <span>${item.name} - Rs. ${formatPrice(item.price)}</span>
          <button class="remove-button"
                  onclick="removeFromCart(${index})">
            Remove
          </button>
        `;

        container.appendChild(row);
      });

      if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
      }

      document.getElementById("total").textContent =
        formatPrice(total);

      document.getElementById("cart-count").textContent =
        cart.length;
    }

    function showCart() {
      document.getElementById("cart-section")
        .scrollIntoView({ behavior: "smooth" });
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Please add products to your cart.");
        return;
      }

      alert("Demo only! Real checkout will be added later.");
    }

    document.getElementById("search")
      .addEventListener("input", event => {
        displayProducts(event.target.value);
      });

    displayProducts();
    updateCart();
  </script>
</body>
</html>
